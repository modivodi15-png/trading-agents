# Which Elliott Wave Scanner version the agents expect, and where its source lives.
# Change `expected_version` deliberately when you move to a new scanner version.

expected_version: v18          # the "EWS vNN" tag the scanner shows in its table (repo version, from CHANGELOG.md).
# v19 is saved in TradingView as script version 31 (2026-10-26), but the chart instance is still on version 30.
# Set this to v19 once the chart shows "EWS v19" (fresh copy of the script added, Mobile table kept).
tradingview_script: "Elliott Wave Scanner 9"   # saved script name in TradingView that holds this version
rider_script: "Elliott Wave Rider"             # the strategy; it imports EWRules too, so rule changes update it as well
tradingview_username: "Baylandreserve_test"   # for the import lines (confirmed by a pine_check compile, 2026-10-26)
table_mode: Mobile             # the scanner's scenarios table mode on your layouts (Mobile or Compact)

# Before v19 the scanner had no version tag. While the chart still runs v18 (saved as script version 30),
# set expected_version: v18 and tv-operator will accept a table with no tag but flag every reading "unverified".

# Your scanner repo: Pine source, CHANGELOG, the rulebook and the Python engine.
# Path is relative to this trading-agents folder. If it doesn't exist, agents clone it from `repo_url`.
repo_path: ../elliott-wave-scanner
repo_url: https://github.com/modivodi15-png/elliott-wave-scanner

rulebook: docs/RULEBOOK.md     # inside repo_path; wave-counter's main source of rules
python_engine: python          # inside repo_path; run with: cd <repo_path>/python && python -m ewscan ...

# Python port status (see CHANGELOG): since v18.1 it matches the scanner on all three degrees, including
# the higher degree's v17e-g changes (127 tests). Any difference from the chart is now a finding to report.
python_parity_note: "all three degrees match the chart since v18.1"
